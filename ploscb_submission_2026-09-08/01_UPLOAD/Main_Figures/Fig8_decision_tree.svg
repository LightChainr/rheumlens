<text x='122.42' y='33.76' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='108.89px' lengthAdjust='spacingAndGlyphs'>Donor-level classifier reports high internal AUC</text>
<text x='122.42' y='66.12' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='144.48px' lengthAdjust='spacingAndGlyphs'>Q0  Can the conditional question be asked with these donors?</text>
<text x='122.42' y='72.75' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='110.33px' lengthAdjust='spacingAndGlyphs'>at least one collection stratum holds both labels</text>
<text x='122.42' y='105.04' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='113.53px' lengthAdjust='spacingAndGlyphs'>Q1  Does the pipeline beat the free permutation?</text>
<text x='122.42' y='111.67' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='105.00px' lengthAdjust='spacingAndGlyphs'>labels permuted freely, whole pipeline refitted</text>
<text x='122.42' y='143.96' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='123.73px' lengthAdjust='spacingAndGlyphs'>Q2  Does it beat the collection-stratified permutation?</text>
<text x='122.42' y='150.60' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='101.30px' lengthAdjust='spacingAndGlyphs'>labels permuted within collection strata only</text>
<text x='122.42' y='182.88' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='95.42px' lengthAdjust='spacingAndGlyphs'>Q3  Is metadata association undetected?</text>
<text x='122.42' y='189.52' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='129.59px' lengthAdjust='spacingAndGlyphs'>metadata-only AUC not beyond its own permutation null</text>
<text x='122.42' y='221.81' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='60.69px' lengthAdjust='spacingAndGlyphs'>Q4  Is restriction feasible?</text>
<text x='122.42' y='228.44' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='117.22px' lengthAdjust='spacingAndGlyphs'>a stratum with ≥5 donors per class and ≥40 in total</text>
<text x='122.42' y='264.04' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='103.92px' lengthAdjust='spacingAndGlyphs'>Q5  Do restriction and residualisation agree?</text>
<text x='122.42' y='306.21' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='132.17px' lengthAdjust='spacingAndGlyphs'>TRANSPORT  ·  external cohort collected a different way</text>
<text x='379.26' y='62.80' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='41.89px' lengthAdjust='spacingAndGlyphs'>NOT ESTIMABLE</text>
<text x='379.26' y='69.44' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='91.36px' lengthAdjust='spacingAndGlyphs'>No collection stratum holds both labels.</text>
<text x='379.26' y='76.07' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='130.80px' lengthAdjust='spacingAndGlyphs'>→ needs donors collected under overlapping conditions.</text>
<text x='379.26' y='101.73' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='74.25px' lengthAdjust='spacingAndGlyphs'>NO DETECTED ASSOCIATION</text>
<text x='379.26' y='108.36' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='97.78px' lengthAdjust='spacingAndGlyphs'>The observed AUC lies inside its own null.</text>
<text x='379.26' y='114.99' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='73.83px' lengthAdjust='spacingAndGlyphs'>→ no discrimination to attribute.</text>
<text x='379.26' y='140.65' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='128.03px' lengthAdjust='spacingAndGlyphs'>NO EVIDENCE BEYOND THE COLLECTION STRATA</text>
<text x='379.26' y='147.28' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='124.91px' lengthAdjust='spacingAndGlyphs'>Discrimination does not exceed what the strata retain;</text>
<text x='379.26' y='153.91' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='81.12px' lengthAdjust='spacingAndGlyphs'>not proof that it is collection-driven.</text>
<text x='379.26' y='179.57' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='130.20px' lengthAdjust='spacingAndGlyphs'>ROUTE A · NO DETECTED METADATA ASSOCIATION</text>
<text x='379.26' y='186.20' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='135.12px' lengthAdjust='spacingAndGlyphs'>The unadjusted estimate stands; no adjustment is implied.</text>
<text x='379.26' y='192.83' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='91.66px' lengthAdjust='spacingAndGlyphs'>Unrecorded structure remains possible.</text>
<text x='379.26' y='218.49' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='102.83px' lengthAdjust='spacingAndGlyphs'>ROUTE C · RESTRICTION NOT FEASIBLE</text>
<text x='379.26' y='225.12' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='112.66px' lengthAdjust='spacingAndGlyphs'>Report both adjusted estimates; claim no bound.</text>
<text x='379.26' y='231.75' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='108.61px' lengthAdjust='spacingAndGlyphs'>→ needs donors under overlapping conditions.</text>
<text x='379.26' y='249.38' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='68.55px' lengthAdjust='spacingAndGlyphs'>ROUTE B1 · CONCORDANT</text>
<text x='379.26' y='256.01' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='129.58px' lengthAdjust='spacingAndGlyphs'>The choice of adjustment does not drive the conclusion.</text>
<text x='379.26' y='275.32' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='65.62px' lengthAdjust='spacingAndGlyphs'>ROUTE B2 · DISCORDANT</text>
<text x='379.26' y='281.96' text-anchor='middle' style='font-size: 5.26px; font-family: "Arial";' textLength='151.36px' lengthAdjust='spacingAndGlyphs'>Report both estimates; they are not bounds on a biological effect.</text>
<text x='246.56' y='66.19' style='font-size: 5.26px; font-style: italic;fill: #4D4D4D; font-family: "Arial";' textLength='5.84px' lengthAdjust='spacingAndGlyphs'>no</text>
<text x='128.12' y='88.90' style='font-size: 5.26px; font-style: italic;fill: #4D4D4D; font-family: "Arial";' textLength='8.17px' lengthAdjust='spacingAndGlyphs'>yes</text>
<text x='246.56' y='105.11' style='font-size: 5.26px; font-style: italic;fill: #4D4D4D; font-family: "Arial";' textLength='5.84px' lengthAdjust='spacingAndGlyphs'>no</text>
<text x='128.12' y='127.82' style='font-size: 5.26px; font-style: italic;fill: #4D4D4D; font-family: "Arial";' textLength='8.17px' lengthAdjust='spacingAndGlyphs'>yes</text>
<text x='246.56' y='144.04' style='font-size: 5.26px; font-style: italic;fill: #4D4D4D; font-family: "Arial";' textLength='5.84px' lengthAdjust='spacingAndGlyphs'>no</text>
<text x='128.12' y='166.74' style='font-size: 5.26px; font-style: italic;fill: #4D4D4D; font-family: "Arial";' textLength='8.17px' lengthAdjust='spacingAndGlyphs'>yes</text>
<text x='246.56' y='182.96' style='font-size: 5.26px; font-style: italic;fill: #4D4D4D; font-family: "Arial";' textLength='8.17px' lengthAdjust='spacingAndGlyphs'>yes</text>
<text x='128.12' y='205.66' style='font-size: 5.26px; font-style: italic;fill: #4D4D4D; font-family: "Arial";' textLength='5.84px' lengthAdjust='spacingAndGlyphs'>no</text>
